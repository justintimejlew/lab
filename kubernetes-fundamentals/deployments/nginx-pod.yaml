apiVersion: v1
kind: Pod
metadata:
  labels:
  name: nginx-scratch
spec:
  containers:
    - image: nginx  # First element
      name: nginx
      volumeMounts:  # Used to specify where to mount containers
        - mountPath: /scratch  # Location of the volume in container
          name: scratch-volume
    - image: busybox
      name: busybox
      command: ["/bin/sh", "-c"]
      args: ["sleep 1000"]
      volumeMounts:
        - mountPath: /scratch
          name: scratch-volume
  volumes:  # Specifies which volumes are associated with the pods
    - name: scratch-volume
      emptyDir:  # This type of volume "emptyDir" is ephemeral storage
        sizeLimit: 500Mi
